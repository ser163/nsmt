[workspace]
resolver = "2"
members = [
    "crates/nsmt-core",
    "crates/nsmt-server",
    "crates/nsmt-client",
    "crates/nsmt-memory",
    "crates/nsmt-fs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ser163/TencentDB-Agent-Memory" # 待定：NSMT 独立仓库后更新

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
machine-uid = "0.6"
hostname = "0.4"
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", features = ["rustls", "runtime-tokio"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
notify = "6"
object_store = { version = "0.11", features = ["aws"] }
tokio-util = "0.7"
async-trait = "0.1"
chacha20poly1305 = "0.10"
axum = "0.8"
sqlx = { version = "0.8", features = ["any","sqlite","mysql","postgres","runtime-tokio"] }
argon2 = "0.5"
rand = "0.8"
